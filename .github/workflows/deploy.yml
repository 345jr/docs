name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Package
        run: |
          cd build
          zip -r ../docs-web.zip .
          ls -la ../docs-web.zip

      - name: Create Release
        run: |
          gh release delete docs-latest --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh release create docs-latest \
            --repo ${{ github.repository }} \
            --title "Lopop Docs Latest" \
            --notes "Built from ${{ github.sha }}" \
            --target ${{ github.ref_name }}
          gh release upload docs-latest docs-web.zip \
            --repo ${{ github.repository }} --clobber

      - name: Record Commit
        if: github.event_name == 'push'
        run: |
          cat <<'PAYLOAD' | curl -sf -X POST "http://107.174.102.34/steward/hooks/commits?token=${{ secrets.STEWARD_HOOK_TOKEN }}" -H "Content-Type: application/json" -d @- || echo " ⚠ commit 记录失败"
          {"project":"docs","sha":"${{ github.sha }}","message":${{ toJSON(github.event.head_commit.message) }}}
          PAYLOAD

      - name: Notify Steward
        if: always()
        run: |
          STATUS=""
          REASON=""
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="build_failed"
            REASON="GitHub Actions build failed: run ${{ github.run_id }}"
          fi

          curl -s -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"project\":\"docs\",\"status\":\"${STATUS}\",\"reason\":\"${REASON}\",\"ref\":\"${{ github.sha }}\"}" || true
